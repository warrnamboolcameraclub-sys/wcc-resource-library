name: WCC Resource Library - Build Validation

on:
  push:
    branches: ['main']
    paths:
      - 'content/**'
      - 'config/**'
      - 'assets/**'
      - 'templates/**'
      - 'scripts/**'
      - 'wcc_library/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-library.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'config/**'
      - 'assets/**'
      - 'templates/**'
      - 'scripts/**'
      - 'wcc_library/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Resource Library
        run: python scripts/build_library.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Upload preview site artifact
        uses: actions/upload-artifact@v7
        with:
          name: wcc-resource-library-preview
          path: _site/
          if-no-files-found: error
          retention-days: 7

# GitHub Pages deployment remains deliberately disabled in Phase 2.
# Once the generated site is reviewed, the final Pages deployment job will
# publish the already-validated _site/ directory without introducing a second
# source of truth.
