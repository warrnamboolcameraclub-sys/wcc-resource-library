name: WCC Resource Library - Build and Deploy

on:
  push:
    branches: ['main']
    paths:
      - 'content/**'
      - 'config/**'
      - 'assets/**'
      - 'templates/**'
      - 'scripts/**'
      - 'wcc_library/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-library.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'config/**'
      - 'assets/**'
      - 'templates/**'
      - 'scripts/**'
      - 'wcc_library/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-library.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate newsletter metadata
        run: python scripts/validate_sources.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build Resource Library
        run: python scripts/build_library.py

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: wcc-resource-library-preview
          path: _site/
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
